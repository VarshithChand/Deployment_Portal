name: Docker Build and Push

###############################################################
# Builds all five of the Deployment Portal's own Docker images
# (the backend API, the frontend UI, and the three sample
# services -- see docker-compose.yml at the repo root) and
# pushes them to GitHub Container Registry.
#
# Uses GITHUB_TOKEN, not a separate secret -- GHCR accepts it
# directly, so there's nothing extra to configure on a fresh
# clone of this repo.
###############################################################

on:
  workflow_dispatch:

  push:
    branches:
      - master
    paths:
      - 'deployment-ui/**'
      - 'src/DeploymentAPI/**'
      - 'src/AdminAPI/**'
      - 'src/PMSCoreAPI/**'
      - 'src/SecurityAPI/**'
      - 'docker-compose.yml'
      - '.github/workflows/Docker Build and Push.yml'

concurrency:
  group: docker-build-push-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:

###############################################################
# Build + push all five images. One job, matrixed over all of
# them -- they build independently and don't depend on each
# other.
###############################################################

  build_and_push:

    name: Build and Push - ${{ matrix.name }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            context: ./src/DeploymentAPI
            dockerfile: ./src/DeploymentAPI/Dockerfile
            image: deployment-portal-api

          - name: UI
            context: ./deployment-ui
            dockerfile: ./deployment-ui/Dockerfile
            image: deployment-portal-ui

          - name: AdminAPI
            context: ./src/AdminAPI
            dockerfile: ./src/AdminAPI/Dockerfile
            image: deployment-portal-admin-api

          - name: PMSCoreAPI
            context: ./src/PMSCoreAPI
            dockerfile: ./src/PMSCoreAPI/Dockerfile
            image: deployment-portal-pmscore-api

          - name: SecurityAPI
            context: ./src/SecurityAPI
            dockerfile: ./src/SecurityAPI/Dockerfile
            image: deployment-portal-security-api

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log In to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

###############################################################
# GHCR requires a lowercase image path -- a GitHub username or
# org name isn't guaranteed to be, so this can't just use
# github.repository_owner directly.
###############################################################

      - name: Lowercase Image Owner
        id: owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and Push - ${{ matrix.name }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

###############################################################
# Summary
###############################################################

  push_complete:

    name: Push Completed

    needs: build_and_push

    if: always()

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Push Summary
        run: |

          echo "========================================="
          echo "Docker Build and Push Summary"
          echo "========================================="
          echo "Branch : $GITHUB_REF_NAME"
          echo "Commit : $GITHUB_SHA"
          echo "Result : ${{ needs.build_and_push.result }}"
          echo "========================================="
