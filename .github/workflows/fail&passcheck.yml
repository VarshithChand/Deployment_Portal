name: Fail and Pass Check

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Replace these steps with your real build
      - name: Build
        run: |
          echo "Starting Build..."
          echo "Build completed successfully."

      # Uncomment this only to test email notifications
      # - name: Force Failure
      #   run: |
      #     echo "Testing failure notification"
      #     exit 1

  notify-failure:
    name: Notify Dev Team
    runs-on: ubuntu-latest
    needs: build

    if: failure()

    steps:
      - name: Send Failure Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "❌ Pipeline Failed - ${{ github.repository }}"

          to: ${{ secrets.DEV_TEAM_EMAILS }}

          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>

          body: |
            Hello Team,

            The GitHub Actions pipeline has FAILED.

            ------------------------------------------
            Repository : ${{ github.repository }}
            Workflow   : ${{ github.workflow }}
            Branch     : ${{ github.ref_name }}
            Triggered By : ${{ github.actor }}
            Event      : ${{ github.event_name }}
            Commit     : ${{ github.sha }}
            Run Number : ${{ github.run_number }}
            ------------------------------------------

            Pipeline URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please review the pipeline logs and resolve the issue.

            Regards,
            GitHub Actions
