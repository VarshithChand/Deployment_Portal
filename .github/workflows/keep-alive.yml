name: Keep Backend Awake

# Render's free tier spins the deployment-portal-sec0 service down after
# ~15 minutes with no traffic - the next request then pays a 15-60s cold
# start. Pinging the health endpoint often enough that it never goes that
# long idle keeps the portal responsive for anyone opening it after a gap,
# without needing a paid Render plan.
#
# Demoted to a redundant BACKUP, not the primary mechanism - checked via
# `gh run list --workflow="Keep Backend Awake"` and found this was
# actually firing every 2-4.5 hours in practice, not every 10 minutes as
# configured below. GitHub's own docs describe scheduled workflows as
# best-effort and subject to delay under platform load, which is
# consistent with what was observed. worker/keep-alive.js (a Cloudflare
# Cron Trigger on the same Worker that already serves the frontend) is
# now the primary keep-alive - this file is left running alongside it
# since an extra ping is harmless, not because it's relied on alone.
on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    # Just curls an external URL - never touches this repo's contents or
    # anything else the default GITHUB_TOKEN scope would matter for.
    permissions: {}

    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sf -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://deployment-portal-sec0.onrender.com/api/health
