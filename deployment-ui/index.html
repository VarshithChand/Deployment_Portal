<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deployment Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Inlined so this paints immediately on a hard refresh, before the
         app's own stylesheet (injected by the JS bundle) has loaded — this
         is what's on screen instead of a blank tab while React boots. Once
         React mounts, its first render replaces everything inside #root,
         so this markup/CSS is simply discarded — no cleanup needed. */
      html, body { margin: 0; padding: 0; }

      /* Glass (default/no data-style yet) — aurora wash, matches global.css's
         own :root tokens exactly so there's no flash-then-shift once the
         real stylesheet takes over. */
      #root {
        min-height: 100vh;
        background: #eef2ff;
        background-image:
          radial-gradient(42% 44% at 12% 8%, #dbeafe 0%, transparent 60%),
          radial-gradient(46% 50% at 88% 4%, #ede9fe 0%, transparent 62%),
          radial-gradient(50% 55% at 78% 92%, #cffafe 0%, transparent 60%);
      }
      html[data-theme="dark"] #root {
        background: #070b1a;
        background-image:
          radial-gradient(42% 44% at 12% 8%, #1e1b4b 0%, transparent 60%),
          radial-gradient(46% 50% at 88% 4%, #0c1a3a 0%, transparent 62%),
          radial-gradient(50% 55% at 78% 92%, #083344 0%, transparent 60%);
      }
      /* Other three styles get a flat fallback fill (no gradient) — each
         has its own real background effect once the app's stylesheet
         loads, this is only ever visible for a split second. */
      html[data-style="brutal"] #root { background: #f4f1e9; background-image: none; }
      html[data-style="brutal"][data-theme="dark"] #root { background: #1a1a1a; background-image: none; }
      html[data-style="minimal"] #root { background: #fafafa; background-image: none; }
      html[data-style="minimal"][data-theme="dark"] #root { background: #101012; background-image: none; }
      html[data-style="neon"] #root,
      html[data-style="neon"][data-theme="dark"] #root { background: #05070e; background-image: none; }
      html[data-style="neon"][data-theme="light"] #root { background: #eef6fa; background-image: none; }
      html[data-style="clay"] #root { background: #e7ebf5; background-image: none; }
      html[data-style="clay"][data-theme="dark"] #root { background: #1e2330; background-image: none; }
      html[data-style="midnight"] #root,
      html[data-style="midnight"][data-theme="dark"] #root { background: #0d1117; background-image: none; }
      html[data-style="midnight"][data-theme="light"] #root { background: #f6f8fa; background-image: none; }
      html[data-style="sunset"] #root { background: #fff8f3; background-image: none; }
      html[data-style="sunset"][data-theme="dark"] #root { background: #221515; background-image: none; }
      html[data-style="mono"] #root { background: #f6f5f2; background-image: none; }
      html[data-style="mono"][data-theme="dark"] #root { background: #161412; background-image: none; }

      .boot-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 34px;
        font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      /* Concentric rings pulsing outward from behind the tile, staggered
         so a new one starts as the previous fades — reads as "emitting"
         rather than a single repeating ripple. */
      .boot-loader-mark { position: relative; width: 128px; height: 128px; display: grid; place-items: center; }

      .boot-loader-ring {
        position: absolute;
        top: 50%; left: 50%;
        width: 64px; height: 64px;
        border-radius: 18px;
        border: 2px solid #3b82f6;
        transform: translate(-50%, -50%);
        animation: boot-emit 2.4s ease-out infinite;
        opacity: 0;
      }
      html[data-theme="dark"] .boot-loader-ring { border-color: #60a5fa; }
      .boot-loader-ring:nth-child(2) { animation-delay: .8s; }
      .boot-loader-ring:nth-child(3) { animation-delay: 1.6s; }

      .boot-loader-tile {
        position: relative;
        width: 64px; height: 64px;
        border-radius: 16px;
        overflow: hidden;
        background: linear-gradient(150deg, #3b82f6, #2563eb);
        box-shadow: 0 16px 40px -10px rgba(37,99,235,.65), inset 0 1px 0 rgba(255,255,255,.35);
        display: grid;
        place-items: center;
        animation: boot-breathe 2.4s ease-in-out infinite;
      }

      .boot-loader-tile svg { width: 32px; height: 32px; animation: boot-lift 2.4s ease-in-out infinite; }

      /* A second, fainter copy of the mark rising and fading inside the
         tile — a "ghost" trailing the main glyph's own subtle lift. */
      .boot-loader-ghost {
        position: absolute; left: 50%; top: 50%;
        width: 22px; height: 22px;
        transform: translate(-50%, -50%);
        animation: boot-rise 2.4s ease-in infinite;
      }
      .boot-loader-ghost svg { width: 22px; height: 22px; }

      .boot-loader-tile::after {
        content: "";
        position: absolute; inset: 0;
        background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.45) 50%, transparent 70%);
        transform: translateX(-120%);
        animation: boot-sheen 2.4s ease-in-out infinite;
      }

      .boot-loader-caption { text-align: center; }
      .boot-loader-caption .boot-loader-title { font-size: 16px; font-weight: 600; letter-spacing: -.01em; color: #0f172a; }
      html[data-theme="dark"] .boot-loader-caption .boot-loader-title { color: #e7ecf6; }
      .boot-loader-caption .boot-loader-sub {
        margin-top: 5px; font-size: 12.5px; color: #64748b;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
      }
      html[data-theme="dark"] .boot-loader-caption .boot-loader-sub { color: #a3b0cc; }

      .boot-loader-dots span { animation: boot-blink 1.4s infinite; }
      .boot-loader-dots span:nth-child(2) { animation-delay: .2s; }
      .boot-loader-dots span:nth-child(3) { animation-delay: .4s; }

      .boot-loader-track {
        width: 190px; height: 5px;
        border-radius: 999px;
        background: rgba(37,99,235,.14);
        overflow: hidden;
        position: relative;
      }
      html[data-theme="dark"] .boot-loader-track { background: rgba(96,165,250,.16); }
      .boot-loader-track::after {
        content: "";
        position: absolute; top: 0; left: -42%;
        height: 100%; width: 42%;
        border-radius: 999px;
        background: linear-gradient(90deg, #2563eb, #3b82f6);
        animation: boot-slide 1.5s ease-in-out infinite;
      }

      @keyframes boot-emit {
        0% { opacity: .55; transform: translate(-50%, -50%) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -58%) scale(2.1); }
      }
      @keyframes boot-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @keyframes boot-lift {
        0%, 100% { transform: translateY(2px); }
        45% { transform: translateY(-4px); }
      }
      @keyframes boot-rise {
        0% { opacity: 0; transform: translate(-50%, -10%); }
        30% { opacity: .5; }
        70%, 100% { opacity: 0; transform: translate(-50%, -140%); }
      }
      @keyframes boot-sheen {
        0%, 55% { transform: translateX(-120%); }
        80%, 100% { transform: translateX(120%); }
      }
      @keyframes boot-blink {
        0%, 80%, 100% { opacity: .2; }
        40% { opacity: 1; }
      }
      @keyframes boot-slide {
        0% { left: -42%; }
        100% { left: 100%; }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-loader-ring, .boot-loader-tile, .boot-loader-tile svg, .boot-loader-ghost,
        .boot-loader-tile::after, .boot-loader-dots span, .boot-loader-track::after {
          animation: none;
        }
      }
    </style>
    <script>
      // Read the persisted theme + style synchronously, before first paint,
      // so the boot loader doesn't flash the wrong look for a split second
      // (ThemeProvider/StyleProvider do the same read again once React
      // mounts).
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var theme = stored === 'light' || stored === 'dark' ? stored : systemTheme;
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          console.warn('Unable to read persisted theme preference', e);
        }
        try {
          var storedStyle = localStorage.getItem('appStyle');
          var validStyles = ['glass', 'brutal', 'minimal', 'neon', 'clay', 'midnight', 'sunset', 'mono'];
          if (validStyles.indexOf(storedStyle) !== -1) {
            document.documentElement.dataset.style = storedStyle;
          }
        } catch (e) {
          console.warn('Unable to read persisted style preference', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader">
        <div class="boot-loader-mark">
          <span class="boot-loader-ring"></span>
          <span class="boot-loader-ring"></span>
          <span class="boot-loader-ring"></span>
          <div class="boot-loader-tile">
            <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
              <g fill="none" stroke="#ffffff" stroke-width="4.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13.5 18 L24 9 L34.5 18" />
                <path d="M13.5 27.8 L24 18.8 L34.5 27.8" opacity=".62" />
                <path d="M13.5 37.5 L24 28.5 L34.5 37.5" opacity=".34" />
              </g>
            </svg>
            <div class="boot-loader-ghost">
              <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
                <g fill="none" stroke="#ffffff" stroke-width="4.9" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M13.5 18 L24 9 L34.5 18" />
                  <path d="M13.5 27.8 L24 18.8 L34.5 27.8" opacity=".62" />
                  <path d="M13.5 37.5 L24 28.5 L34.5 37.5" opacity=".34" />
                </g>
              </svg>
            </div>
          </div>
        </div>
        <div class="boot-loader-caption">
          <div class="boot-loader-title">Loading<span class="boot-loader-dots"><span>.</span><span>.</span><span>.</span></span></div>
          <div class="boot-loader-sub">Deployment Portal</div>
        </div>
        <div class="boot-loader-track"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
