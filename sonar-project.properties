sonar.organization=varshithchand
sonar.projectKey=VarshithChand_yaml

# Scope analysis to the app itself. .claude/ holds Claude Code skill
# scripts (Python), not application code - SonarCloud's own Automatic
# Analysis mode scans the whole repo by default without this, which is
# why it was asking about Python version/test config for files that
# aren't part of the Deployment Portal at all.
sonar.exclusions=.claude/**,**/bin/**,**/obj/**,deployment-ui/dist/**,deployment-ui/node_modules/**
